name: "[dev] LAN Play test builds"

# Branch-local workflow, added for the LAN Play work: produces runnable, self-contained builds for
# Windows, Linux and macOS so LAN Play can be tried on real machines (and between them, through a
# relay) without setting up a toolchain on each one.
#
# Like dev-lan-play-check.yml it is deliberately kept out of the upstream project: manual runs only,
# and every job is skipped unless it runs in a Nextendo fork. These are *test* builds, so the
# Nextendo server addresses are not baked in and the tree falls back to loopback for them; use the
# release workflow for real builds.
# To drop it before upstreaming, delete .github/workflows/dev-*.yml; they are self-contained.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: Release
        type: choice
        options: [Release, Debug]
      platforms:
        description: "Which builds to produce"
        required: false
        default: all
        type: choice
        options: [all, windows, linux, macos]

concurrency:
  group: dev-lan-play-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    if: contains(github.repository, 'Ryujinx-Nextendo')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (win-x64)
            os: windows-latest
            rid: win-x64
            group: windows
          - name: Linux (linux-x64)
            os: ubuntu-latest
            rid: linux-x64
            group: linux
    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Decide whether this platform was requested
        id: gate
        run: |
          requested="${{ github.event.inputs.platforms || 'all' }}"

          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.group }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only \"$requested\" was requested, skipping ${{ matrix.name }}."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Set up .NET (from global.json)
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish a self-contained build
        if: steps.gate.outputs.run == 'true'
        run: >
          dotnet publish src/Ryujinx/Ryujinx.csproj -c "$CONFIGURATION" -r ${{ matrix.rid }}
          --self-contained true -p:DebugType=embedded
          -p:Version=0.0.0-lanplay -p:SourceRevisionId=${{ github.sha }}
          -o publish/${{ matrix.rid }}

      - name: Upload the build
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ryujinx-lanplay-${{ matrix.rid }}-${{ env.CONFIGURATION }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  macos:
    if: |
      contains(github.repository, 'Ryujinx-Nextendo') &&
      (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos')
    name: macOS (universal .app)
    runs-on: macos-14
    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The .app bundle, lipo and the ad-hoc signing all need macOS tooling, so the maintained script
      # is reused rather than reimplemented here.
      - name: Build the universal .app
        run: |
          chmod +x distribution/macos/*.sh
          ./distribution/macos/create_macos_pr_build_ava.sh \
            "$PWD" macos_tmp macos_out \
            distribution/macos/entitlements.xml \
            0.0.0-lanplay "${{ github.sha }}" "$CONFIGURATION"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ryujinx-lanplay-macos-universal-${{ env.CONFIGURATION }}
          path: macos_out
          if-no-files-found: error

  instructions:
    if: always() && contains(github.repository, 'Ryujinx-Nextendo')
    name: How to test these builds
    runs-on: ubuntu-latest
    needs: [desktop, macos]
    steps:
      - name: Write the instructions into the run summary
        run: |
          {
            echo "### Trying LAN Play with these builds"
            echo
            echo "1. Download the artifact for each machine and unpack it (on macOS keep the \`.app\`)."
            echo "2. On Linux, \`chmod +x Ryujinx\` first. No administrator or root rights are needed and"
            echo "   nothing about the host network configuration has to change."
            echo "3. In *Settings -> Network*, set **Multiplayer mode** to **LAN Play** and enter the same"
            echo "   relay on every machine, for example \`switch.example.com:11451\`. Leave **Virtual IP** empty."
            echo "4. Press **Test**: it joins the relay and reports the virtual address it would use and which"
            echo "   other participants it can see, without starting a game."
            echo "5. Launch the same game on each machine and enter its local multiplayer mode."
            echo "6. For a packet level view, enable *Settings -> Logging -> Enable network logs*: a line per"
            echo "   packet, a reason for every dropped one, and a traffic summary every 30 seconds."
            echo
            echo "These are test builds: the Nextendo server addresses are not baked in, so features other"
            echo "than LAN Play fall back to loopback. Use the release workflow for real builds."
          } >> "$GITHUB_STEP_SUMMARY"
