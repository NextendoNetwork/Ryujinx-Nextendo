name: "[dev] LAN Play cross-platform check"

# Branch-local workflow, added for the LAN Play work: builds the whole solution and runs the LAN Play
# tests on Windows, Linux and macOS, so a platform specific mistake shows up without needing three
# machines at hand.
#
# It is deliberately kept out of the upstream project:
#   * it never triggers on main, on a tag or on a release, only on the development branches below and
#     on a manual run;
#   * every job is skipped unless the workflow runs in a Nextendo fork, so it stays inert if the
#     branch ever ends up somewhere else.
# To drop it before upstreaming, delete .github/workflows/dev-*.yml; they are self-contained.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: Debug
        type: choice
        options: [Debug, Release]
      test_repeats:
        description: "How many times to run the LAN Play tests (they are timing sensitive)"
        required: false
        default: "3"
  push:
    branches:
      - "claude/**"
      - "lan-play/**"
      - "dev/**"
      - "test/**"

concurrency:
  group: dev-lan-play-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Only ever runs in the Nextendo forks, never in the upstream project.
    if: contains(github.repository, 'Ryujinx-Nextendo')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
          - name: Windows (x64)
            os: windows-latest
          - name: macOS (arm64)
            os: macos-14
    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Debug' }}
      TEST_REPEATS: ${{ github.event.inputs.test_repeats || '3' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build the solution
        run: dotnet build Ryujinx.sln -c "$CONFIGURATION"

      # The build regenerates assets/Locales, so a missing translation key shows up as a diff here
      # instead of as a puzzling string at runtime.
      - name: Check the locale files were not rewritten by the build
        run: git diff --exit-code -- assets/Locales

      # The LAN Play tests exercise the relay client, the virtual interface, TCP, the LDN session and
      # teardown. They are timing sensitive and the hosted runners are far slower than a desktop, so
      # they run several times on purpose.
      - name: Run the LAN Play tests
        run: |
          for i in $(seq 1 "$TEST_REPEATS"); do
            echo "::group::LAN Play test run $i of $TEST_REPEATS"
            dotnet test src/Ryujinx.Tests/Ryujinx.Tests.csproj -c "$CONFIGURATION" --no-build \
              --filter "FullyQualifiedName~LanPlayTests" \
              --logger "trx;LogFileName=lan-play-${{ runner.os }}-$i.trx" \
              --results-directory artifacts/test-results
            echo "::endgroup::"
          done

      # Informational: these cover unrelated HLE areas, so a failure here is not a LAN Play problem.
      - name: Run the other HLE tests
        continue-on-error: true
        run: >
          dotnet test src/Ryujinx.Tests/Ryujinx.Tests.csproj -c "$CONFIGURATION" --no-build
          --filter "FullyQualifiedName~Ryujinx.Tests.HLE&FullyQualifiedName!~LanPlayTests"
          --logger "trx;LogFileName=hle-${{ runner.os }}.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: warn
